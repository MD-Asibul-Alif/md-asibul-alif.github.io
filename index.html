:root{
  --bg:#0a1122; --panel:#111b32; --card:#14203a; --line:#25324e;
  --ink:#eef2f8; --ink-dim:#a3b2c9; --navy:#5b9be0; --navy-soft:#7fb4ea;
  --sans:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;scroll-padding-top:74px;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased;}
::selection{background:var(--navy);color:#fff;}
.wrap{max-width:1040px;margin:0 auto;padding:0 28px;}
a{color:var(--navy-soft);}

nav{position:sticky;top:0;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(10,17,34,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
.navbar{max-width:1040px;margin:0 auto;padding:16px 28px;display:flex;justify-content:space-between;align-items:center;}
.brand{font-family:var(--serif);font-size:19px;color:var(--ink);text-decoration:none;font-weight:600;}
.navlinks{display:flex;gap:26px;font-size:14px;}
.navlinks a{color:var(--ink-dim);text-decoration:none;padding-bottom:2px;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;}
.navlinks a:hover{color:var(--ink);}
.navlinks a.active{color:var(--ink);border-color:var(--navy);}
.cta-pill{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--bg);text-decoration:none;font-size:13.5px;font-weight:600;padding:10px 18px;border-radius:100px;white-space:nowrap;}
.cta-pill:hover{opacity:.85;}

e0","degree":"B.Sc. Engineering in Mechanical Engineering","org":"Bangladesh Army University of Science & Technology (BAUST)","score":"3.76 / 4.00","notes":["Ranked 1st (2 semesters) and 2nd (5 semesters) in the Department Merit List","Tuition scholarship for GPA ≥ 3.98 — awarded 7 times"]},{"id":"e1","degree":"Higher Secondary Certificate","org":"BAF Shaheen College, Chittagong","score":"5.00 / 5.00","notes":[]},{"id":"e2","degree":"Secondary School Certificate","org":"Bangladesh Bank Colony High School, Chittagong","score":"5.00 / 5.00","notes":[]}],"experience":[{"id":"w1","role":"Industrial Training","org":"Al-Razi Chemical Complex Ltd. (SMART Group), Hathazari — 150 t/day H₂O₂ plant","notes":["Hands-on experience to preventive, corrective, and breakdown maintenance of rotating and static equipment including reciprocating/centrifugal/magnetic pumps, and NG/PA/IA compressors, package boiler, heat exchangers, chillers, and cooling tower.","Gained practical knowledge of pump selection for water treatment plant, considering relevant operating parameters.","Developed knowledge of industrial valves and piping/fluid-handling components, including valves, elbows, flanges, reducers, strainers, mechanical seals, and gaskets. Gained knowledge to chemical process equipment, including extractors, reactors, oxidizers, oxidigassers, desulfurizers, reformers, and shift converters etc.","Assisted in equipment inspection, checklist based data entry for maintenance records, and identification of spare-parts requirements."]},{"id":"w2","role":"Industrial Training (3 weeks)","org":"United Power Generation & Distribution Ltd. (UPGDL)","notes":["Hands-on experience to preventive, corrective,and breakdown maintenance of rotating and static equipment including reciprocating/centrifugal pumps, and IA compressors, EGB boiler, heat exchangers, chillers, radiator and cooling tower.","Assisted in preventive and breakdown maintenance of Rolls-Royce and Wärtsilä gas engines involving lubricating-oil filters, preignition chambers, PCB valves, EGR systems, turbochargers, engine cylinders/cylinder heads, pistons.","Actively participated in Instrument Air (IA) compressor troubleshooting by monitoring oil level, operating pressure, and inlet/outlet flow rate.","Participated in scheduled maintenance of EGB boilers, chiller units, and induced-draft cooling towers, including involvement in EGB boiler commissioning.","Monitored key engine operating parameters, including mean cylinder pressure and operating temperature, for equipment condition","assessment and troubleshooting.","Participated in regular equipment inspections using inspection checklists and maintained individual machine/equipment maintenance records.","Assisted in troubleshooting an RO water plant pump shutdown caused by vibration due to improper pump–motor coupling alignment, including angular and axial alignment correction.","contributed to safe plant operations by supporting SOP development"]},{"id":"w0","role":"Intern Mechanical Engineer (hybrid)","org":"Adhar Technologies — digital & analog electronics design startup","notes":["Assisted in instrument calibration, workshop operations, BOQ of project, design electrical circuit safety enclosure and Project Execution"]}],"projects":[{"id":"p0","title":"Hybrid ORC–Kalina Cycle Waste-Heat Recovery","type":"Thesis","subtitle":"Development, Mathematical Modeling and Validation of a Hybrid Organic Rankine Cycle–Kalina Cycle Waste Heat Recovery System Using a Validated Ammonia–Water Thermodynamic Property Model","summary":"Large amounts of industrial energy are lost as low- and medium-temperature waste heat. Steam Rankine cycles perform poorly at these temperatures and the ORC has thermal-matching limits, while the Kalina cycle's ammonia–water mixture matches the heat source more closely. This thesis builds the models needed to compare these cycles and combine them into a hybrid ORC–Kalina system, with a techno-economic view of the result.","bullets":[],"sections":[{"h":"Objectives","items":["Mathematical models of ORC and Kalina cycles for low-grade waste heat","Develop and validate an ammonia–water property module","Develop and simulate the hybrid ORC–Kalina cycle","Evaluate thermodynamic and techno-economic performance"]},{"h":"Real heat sources considered","items":["Al-Razi Chemical Complex — exhaust gas at about 150 °C","Taslim Chemical Complex, Narayanganj — 160–170 °C exhaust from the EGB silencer at 65,300 kg/hr"]},{"h":"Methodology","items":["Python cycle models (Kalina and basic ORC) built on an ammonia–water property module covering enthalpy, entropy and vapor–liquid behavior","Equipment cost estimation with the Turton method — base purchased cost, bare-module cost, pressure factor and CEPCI update — with separate modules for heat exchanger, separator, turbine and pump"]},{"h":"Validation & results","items":["Model shows good agreement with the published KCS11 results of Elsayed et al. (2013); a small deviation at low ammonia mass fractions is attributed to property-correlation and numerical differences","Results cover ammonia–water property behavior and thermal efficiency versus ammonia mass fraction at 10, 15, 30 and 40 bar"]}],"specs":["Python simulation","Benchmark: Elsayed et al. (2013), KCS11","Next: hybrid performance analysis, variable heat-source control, lifecycle assessment"],"image":null,"fit":"cover"},{"id":"p1","title":"Harmony Wind Turbine with Furling Mechanism","type":"Research project","subtitle":"","summary":"A research-based project on the design and development of a small wind turbine built around a furling mechanism, a passive way of limiting rotor exposure in strong wind.","bullets":["Vertical, multi-tier rotor with stacked blade stages coupled through gears on a central shaft","Mounted in a plywood-and-steel frame and run under fan-driven airflow to observe rotor behavior"],"sections":[],"specs":[],"image":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAwICQsJCAwLCgsODQw function sha256(ascii){
  function rr(v, a){ return (v >>> a) | (v << (32 - a)); }
  var maxWord = Math.pow(2, 32), result = '', i, j, words = [], bitLen = ascii.length * 8, hash = [], k = [], pc = 0, comp = {};
  for (var cand = 2; pc < 64; cand++) {

      hash[pc] = (Math.pow(cand, .5) * maxWord) | 0; k[pc++] = (Math.pow(cand, 1 / 3) * maxWord) | 0;
    }
  }
  ascii += '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (i = 0; i < ascii.length; i++) { j = ascii.charCodeAt(i); words[i >> 2] |= j << ((3 - i) % 4) * 8; }
  words[words.length] = ((bitLen / maxWord) | 0); words[words.length] = bitLen;
  for (j = 0; j < words.length;) {
    var w = words.slice(j, j += 16), old = hash; hash = hash.slice(0, 8);
    for (i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
      var t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] +
        (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);

  }

}

/* ---------- image helper ---------- */
function resizeImage(file, max, square, q){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onerror = function(){ rej(new Error('read')); };
    fr.onload = function(){
      var im = new Image();
      im.onerror = function(){ rej(new Error('decode')); };
      im.onload = function(){
        var w = im.width, hh = im.height, c = document.createElement('canvas'), g = c.getContext('2d');
        g.fillStyle = '#fff';
        if (square) {
          var s = Math.min(w, hh), out = Math.min(max, s);
          c.width = c.height = out; g.fillRect(0, 0, out, out);
          g.drawImage(im, (w - s) / 2, Math.max(0, (hh - s) * 0.12), s, s, 0, 0, out, out);
        } else {
          var k = Math.min(1, max / Math.max(w, hh));
          c.width = Math.round(w * k); c.height = Math.round(hh * k);
          g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
        }
        res(c.toDataURL('image/jpeg', q));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- modal form ---------- */
function closeModal(){ var m = $('modalBg'); if (m) m.remove(); }
function openForm(title, fields, vals, onSave, opts){
  closeModal();
  var work = clone(vals), getters = [];
  var form = h('div', { class: 'modal' }, [h('h3', { text: title })]);
  fields.forEach(function(f){
    var wrap = h('div', { class: 'fld' }), input;
    wrap.appendChild(h('label', { text: f.label }));
    if (f.type === 'text' || f.type === 'password') {
      input = h('input', { type: f.type, value: work[f.key] || '' });
      getters.push(function(){ work[f.key] = input.value.trim(); });
      wrap.appendChild(input);
    } else if (f.type === 'textarea' || f.type === 'lines') {
      var v = f.type === 'lines' ? (work[f.key] || []).join('\n') : (work[f.key] || '');
      input = h('textarea', { rows: f.rows || 4 }); input.value = v;
      getters.push(function(){ work[f.key] = f.type === 'lines' ? input.value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean) : input.value.trim(); });
      wrap.appendChild(input);
    } else if (f.type === 'checkbox') {
      input = h('input', { type: 'checkbox' }); input.checked = work[f.key] === 'contain';
      getters.push(function(){ work[f.key] = input.checked ? 'contain' : 'cover'; });
      wrap.className = 'fld chk'; wrap.insertBefore(input, wrap.firstChild);
    } else if (f.type === 'image') {
      var prev = h('img', { class: 'prev', alt: '' }), msg = h('div', { class: 'hint' });
      function show(){ prev.style.display = work[f.key] ? 'block' : 'none'; if (work[f.key]) prev.src = work[f.key]; }
      var file = h('input', { type: 'file', accept: 'image/*' });
      file.addEventListener('change', function(){
        if (!file.files[0]) return; msg.textContent = 'Processing…';
        resizeImage(file.files[0], f.max || 900, false, 0.82).then(function(d){ work[f.key] = d; msg.textContent = ''; show(); }, function(){ msg.textContent = 'Could not read that image.'; });
      });
      var rm = h('button', { type: 'button', class: 'ghostbtn', text: 'Remove image', onclick: function(){ work[f.key] = null; file.value = ''; show(); } });
      wrap.appendChild(prev); wrap.appendChild(file); wrap.appendChild(rm); wrap.appendChild(msg); show();
    } else if (f.type === 'sections') {
      var list = h('div', { class: 'secs' }), rows = [];
      function addRow(s){
        var hh = h('input', { type: 'text', placeholder: 'Heading, e.g. Methodology', value: s.h || '' });
        var ta = h('textarea', { rows: 3, placeholder: 'One point per line' }); ta.value = (s.items || []).join('\n');
        var row = h('div', { class: 'secrow' }, [hh, ta, h('button', { type: 'button', class: 'ghostbtn', text: 'Remove section', onclick: function(){ rows.splice(rows.indexOf(r), 1); row.remove(); } })]);
        var r = { hh: hh, ta: ta }; rows.push(r); list.appendChild(row);
      }
      (work[f.key] || []).forEach(addRow);
      getters.push(function(){
        work[f.key] = rows.map(function(r){ return { h: r.hh.value.trim(), items: r.ta.value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean) }; }).filter(function(s){ return s.h || s.items.length; });
      });
      wrap.appendChild(list);
      wrap.appendChild(h('button', { type: 'button', class: 'ghostbtn', text: '+ Add detail section', onclick: function(){ addRow({ h: '', items: [] }); } }));
    }
    if (f.hint) wrap.appendChild(h('div', { class: 'hint', text: f.hint }));
    form.appendChild(wrap);
  });
  var err = h('div', { class: 'formerr' });
  form.appendChild(err);
  form.appendChild(h('div', { class: 'btnrow' }, [
    h('button', { type: 'button', class: 'ghostbtn', text: 'Cancel', onclick: closeModal }),
    h('button', { type: 'button', class: 'primbtn', text: opts && opts.ok || 'Done', onclick: function(){
      getters.forEach(function(g){ g(); });
      var req = fields.filter(function(f){ return f.required && !work[f.key]; })[0];
      if (req) { err.textContent = '“' + req.label + '” is required.'; return; }
      var res = onSave(work); if (typeof res === 'string') { err.textContent = res; return; } closeModal();
    } })
  ]));
  var bg = h('div', { id: 'modalBg', class: 'modal-bg' }, [form]);
  bg.addEventListener('mousedown', function(e){ if (e.target === bg) closeModal(); });
  document.body.appendChild(bg);
}

/* ---------- editors ---------- */

    { key: 'degree', label: 'Degree / certificate', type: 'text', required: true },
    { key: 'org', label: 'Institution', type: 'text' },
    { key: 'score', label: 'Result (e.g. 3.76 / 4.00)', type: 'text' },
    { key: 'notes', label: 'Achievements (one per line)', type: 'lines', rows: 4 }
  ], it || { degree: '', org: '', score: '', notes: [] }, function(v){
    if (it) Object.assign(it, v); else draft.education.push(Object.assign({ id: uid() }, v));
    changed();
  });
}
function editExp(it){

    { key: 'role', label: 'Role / title', type: 'text', required: true },
    { key: 'org', label: 'Organization', type: 'text' },

function editProj(p){

    { key: 'subtitle', label: 'Full title / subtitle (optional)', type: 'text' },

  ], p || { title: '', type: '', subtitle: '', summary: '', bullets: [], sections: [], specs: [], image: null, fit: 'cover' }, function(v){

    changed();
  });
}
function changePhoto(){
  var inp = h('input', { type: 'file', accept: 'image/*' });
  inp.addEventListener('change', function(){
    if (!inp.files[0]) return;
    resizeImage(inp.files[0], 420, true, 0.86).then(function(d){ draft.profile.photo = d; changed(); }, function(){ toast('Could not read that image.'); });
  });
  inp.click();
}

/* ---------- save bar / publish ---------- */
function toast(m, ok){
  var e = $('saveMsg'); if (!e) return;
  $('saveBar').style.display = 'flex'; e.textContent = m; e.className = ok ? 'ok' : 'err';
  setTimeout(function(){ e.className = ''; renderSaveBar(); }, ok ? 12000 : 7000);
}
function renderSaveBar(){
  var bar = $('saveBar'); if (!bar) return;
  bar.style.display = (editing && canEdit) ? 'flex' : 'none';
  if (!$('saveMsg').className) $('saveMsg').textContent = dirty ? 'You have unsaved changes' : 'Editing — no changes yet';
  $('saveBtn').disabled = !dirty || saving;
  $('discardBtn').disabled = !dirty || saving;
  $('saveBtn').textContent = saving ? 'Publishing…' : (mode === 'claude' ? 'Save & publish' : 'Download updated file');
  $('logoutBtn').style.display = mode === 'local' ? '' : 'none';
}
function setEditing(on){
  editing = on;
  document.body.classList.toggle('editing', on);
  var t = $('editToggle'); if (t) t.textContent = on ? '✓ Done editing' : '✎ Edit';
  renderSaveBar();
}
function stash(){ try { sessionStorage.setItem('pf-draft', JSON.stringify(draft)); } catch (e) {} }
function unstash(){ try { sessionStorage.removeItem('pf-draft'); } catch (e) {} }
function download(){
  var blob = new Blob([buildDoc(draft)], { type: 'text/html' });
  var a = h('a', { href: URL.createObjectURL(blob), download: 'index.html' });
  document.body.appendChild(a); a.click(); a.remove();
  toast('Downloaded index.html — upload it to your hosting (replace the old file) to make the changes live.', true);
}
function publish(){
  if (mode === 'local') { if (dirty) download(); return; }
  if (!artifactNS || !dirty || saving) return;
  saving = true; renderSaveBar(); stash();
  var doc = buildDoc(draft);
  artifactNS.publish(doc).then(function(){ unstash(); published = true; dirty = false; state = clone(draft); saving = false; renderSaveBar(); $('saveMsg').textContent = 'Published — reloading…'; }, function(err){
    saving = false; renderSaveBar();
    var c = err && err.code, m;
    if (c === 'conflict') return;
    if (c === 'not_writer' || c === 'not_granted' || c === 'consent_required') m = 'This account can’t publish changes to this portfolio.';
    else if (c === 'too_large') m = 'The page is too large to save. Try smaller images or remove one.';
    else if (c === 'rate_limited') m = 'Saving too fast — wait a moment and try again.';
    else m = 'Could not save right now. Your changes are still here — try again.';
    toast(m);
  });
}
function discard(){ draft = clone(state); dirty = false; unstash(); clearLocal(); renderAll(); }

/* ---------- boot ---------- */
function initNav(){
  var links = Array.prototype.slice.call(document.querySelectorAll('.navlinks a')), map = {};
  links.forEach(function(a){ var id = a.getAttribute('href').slice(1), el = $(id); if (el) map[id] = a; });
  if (!('IntersectionObserver' in window)) return;
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      var a = map[en.target.id]; if (!a) return;
      if (en.isIntersecting) { links.forEach(function(l){ l.classList.remove('active'); }); a.classList.add('active'); }
    });
  }, { rootMargin: '-45% 0px -50% 0px' });
  Object.keys(map).forEach(function(id){ io.observe($(id)); });
}
function ownerLogin(){
  var auth = currentAuth();
  if (!auth) {
    openForm('Create owner password', [
      { key: 'p1', label: 'New password (at least 6 characters)', type: 'password', required: true },
      { key: 'p2', label: 'Repeat password', type: 'password', required: true }
    ], {}, function(v){
      if (v.p1.length < 6) return 'Use at least 6 characters.';
      if (v.p1 !== v.p2) return 'The two passwords don’t match.';
      var salt = uid();
      try { sessionStorage.setItem(AKEY, '1'); } catch (e) {}
      enableEditor('local');
      draft.auth = { salt: salt, hash: pwHash(salt, v.p1) };
      changed(); setEditing(true);
    }, { ok: 'Create & start editing' });
    var m = document.querySelector('#modalBg .modal');
    m.insertBefore(h('p', { class: 'hint', text: 'This password only unlocks the editor on this site. It is saved inside your downloaded file, so set it once, download the file and upload it to your hosting.' }), m.children[1]);
    return;
  }
  openForm('Owner login', [{ key: 'pw', label: 'Password', type: 'password', required: true }], {}, function(v){
    if (pwHash(auth.salt, v.pw) !== auth.hash) return 'Wrong password.';
    try { sessionStorage.setItem(AKEY, '1'); } catch (e) {}
    enableEditor('local'); setEditing(true);
  }, { ok: 'Log in' });
}
var bound = false;
function enableEditor(kind){
  mode = kind; canEdit = true;
  var t = $('editToggle'); t.hidden = false;
  var ow = $('ownerWrap'); if (ow) ow.style.display = 'none';
  if (!bound) {
    bound = true;
    t.addEventListener('click', function(){ setEditing(!editing); });
    $('saveBtn').addEventListener('click', publish);
    $('discardBtn').addEventListener('click', discard);
    $('logoutBtn').addEventListener('click', function(){ try { sessionStorage.removeItem(AKEY); } catch (e) {} published = true; location.reload(); });
    window.addEventListener('beforeunload', function(e){ if (dirty && !published && mode === 'claude') { e.preventDefault(); e.returnValue = ''; } });
  }
  if (kind === 'claude') {
    try {
      var s = sessionStorage.getItem('pf-draft');
      if (s) {
        if (s === JSON.stringify(state)) unstash();
        else { draft = JSON.parse(s); dirty = true; renderAll(); setEditing(true); }
      }
    } catch (e) {}
  } else {
    var ld = readLocal();
    if (ld && JSON.stringify(ld) !== JSON.stringify(state)) { draft = ld; dirty = true; }
    else { clearLocal(); if (!dirty) draft = clone(state); }
    renderAll();
  }
  renderSaveBar();
}
function boot(){
  ROOT.innerHTML = SHELL.innerHTML;
  var bar = h('div', { id: 'saveBar', class: 'savebar' }, [
    h('span', { id: 'saveMsg', text: '' }),
    h('button', { id: 'logoutBtn', type: 'button', class: 'ghostbtn', text: 'Log out' }),
    h('button', { id: 'discardBtn', type: 'button', class: 'ghostbtn', text: 'Discard' }),
    h('button', { id: 'saveBtn', type: 'button', class: 'primbtn', text: 'Save & publish' })
  ]);
  document.body.appendChild(bar);
  renderAddRows(); renderAll(); initNav();
  var ol = $('ownerLogin'); if (ol) ol.addEventListener('click', function(e){ e.preventDefault(); ownerLogin(); });
  function resume(){ var a = null; try { a = sessionStorage.getItem(AKEY); } catch (e) {} if (a && currentAuth() && !canEdit) { enableEditor('local'); setEditing(true); } }
  if (window.claude && window.claude.use) {
    Promise.all([window.claude.use('user'), window.claude.use('artifact')]).then(function(r){
      artifactNS = r[1];
      if (!r[0] || !artifactNS) return null;
      return r[0].canEdit();
    }).then(function(ok){ if (ok) enableEditor('claude'); else resume(); }, function(){ resume(); });
  } else { resume(); }
}
boot();
})();
